<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoE Inspector — первый запуск</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20256%20256%22%20width=%22256%22%20height=%22256%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22bg%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%231a162f%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23030409%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id=%22ac%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23ff7a94%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23fc4c70%22/%3E%3C/linearGradient%3E%3CradialGradient%20id=%22gl%22%20cx=%22.5%22%20cy=%22.5%22%20r=%22.5%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23fc4c70%22%20stop-opacity=%22.55%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23fc4c70%22%20stop-opacity=%220%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect%20width=%22256%22%20height=%22256%22%20rx=%2256%22%20fill=%22url(%23bg)%22/%3E%3Crect%20x=%225%22%20y=%225%22%20width=%22246%22%20height=%22246%22%20rx=%2252%22%20fill=%22none%22%20stroke=%22%233e2d57%22%20stroke-width=%223%22/%3E%3Ccircle%20cx=%22128%22%20cy=%22132%22%20r=%2296%22%20fill=%22url(%23gl)%22/%3E%3Cpolygon%20points=%22128%2C40%20206%2C84%20206%2C172%20128%2C216%2050%2C172%2050%2C84%22%20fill=%22%233e2d57%22%20stroke=%22%23ffffff%22%20stroke-width=%226%22%20stroke-linejoin=%22round%22/%3E%3Cpolygon%20points=%22128%2C40%20206%2C84%20128%2C128%2050%2C84%22%20fill=%22url(%23ac)%22%20stroke=%22%23ffffff%22%20stroke-width=%226%22%20stroke-linejoin=%22round%22/%3E%3Cpolygon%20points=%2250%2C84%20128%2C128%20128%2C216%2050%2C172%22%20fill=%22%231a162f%22%20stroke=%22%23ffffff%22%20stroke-width=%226%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M128%20128v88%22%20stroke=%22%23ffffff%22%20stroke-width=%226%22/%3E%3Ccircle%20cx=%22168%22%20cy=%22150%22%20r=%2220%22%20fill=%22none%22%20stroke=%22%23ff7a94%22%20stroke-width=%226%22/%3E%3Cpath%20d=%22M182%20165l16%2016%22%20stroke=%22%23ff7a94%22%20stroke-width=%228%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
:root{--bg:#030409;--panel:#1a162f;--surface:#251d3b;--line:#3e2d57;--text:#fff;--dim:#b9aed3;--acc:#fc4c70;--on-acc:#030409;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 'Segoe UI',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 32px}
h1{margin:0 0 6px;font-size:28px}p{color:var(--dim);margin:6px 0 16px}
label{display:block;color:var(--dim);font-size:14px;margin:18px 0 6px}
input[type=text]{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
.found{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.found button{text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.found button:hover{border-color:var(--acc)}
.row{display:flex;gap:12px;align-items:center;margin-top:20px}
.go{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:11px 22px;font:600 17px inherit;cursor:pointer}
.go:disabled{opacity:.4;cursor:default}
.msg{color:var(--dim)}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.bar{height:10px;background:var(--surface);border-radius:6px;overflow:hidden;margin:18px 0 8px;display:none}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.log{font:13px/1.4 Consolas,monospace;color:var(--dim);white-space:pre-wrap;max-height:160px;overflow:auto;margin-top:8px}
small{color:var(--dim)}
</style>
</head>
<body>
<div class="card">
  <h1>Первый запуск</h1>
  <p>PoE Inspector читает файлы вашей установки Path of Exile 2 и строит из них локальную базу. Игра не изменяется, ничего из неё не копируется в программу. Один раз, несколько минут.</p>
  <div id="pick">
    <label for="game">Папка Path of Exile 2</label>
    <input id="game" type="text" placeholder="D:\SteamLibrary\steamapps\common\Path of Exile 2" spellcheck="false">
    <div class="found" id="found"></div>
    <div class="msg" id="chk" style="margin-top:8px"></div>
    <div class="row"><button class="go" id="go" disabled>Построить базу</button><small>Папка должна содержать Bundles2</small></div>
  </div>
  <div id="prog" style="display:none">
    <div class="msg" id="step"></div>
    <div class="bar" id="bar" style="display:block"><i id="fill"></i></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const j = async u => { const r = await fetch(u); return r.json(); };
let t;
async function check() {
  const v = $('#game').value.trim().replace(/^"|"$/g, '');
  if (!v) { $('#chk').textContent = ''; $('#go').disabled = true; return; }
  const r = await j('/api/setup/checkdir?path=' + encodeURIComponent(v));
  $('#chk').className = 'msg ' + (r.ok ? 'ok' : 'bad');
  $('#chk').textContent = r.ok ? 'Папка найдена' + (r.buildid ? ' · сборка Steam ' + r.buildid : '') : 'Здесь нет Bundles2/_.index.bin';
  $('#go').disabled = !r.ok;
}
$('#game').oninput = () => { clearTimeout(t); t = setTimeout(check, 250); };
$('#go').onclick = async () => {
  const r = await j('/api/setup/start?game=' + encodeURIComponent($('#game').value.trim().replace(/^"|"$/g, '')));
  if (r.error) { $('#chk').className = 'msg bad'; $('#chk').textContent = r.error; return; }
  $('#pick').style.display = 'none'; $('#prog').style.display = ''; poll();
};
async function poll() {
  const s = await j('/api/setup/status');
  $('#step').textContent = s.phase === 'error' ? 'Ошибка: ' + s.error : s.phase === 'done' ? 'Готово, открываю программу…' : `Шаг ${s.step} из ${s.steps}: ${s.msg}`;
  $('#step').className = 'msg ' + (s.phase === 'error' ? 'bad' : s.phase === 'done' ? 'ok' : '');
  $('#fill').style.width = (s.phase === 'done' ? 100 : (s.step - 1) / s.steps * 100 + 8) + '%';
  $('#log').textContent = s.log.join('\n');
  if (s.phase === 'done') return setTimeout(() => location.href = '/', 800);
  if (s.phase === 'error') { $('#pick').style.display = ''; return; }
  setTimeout(poll, 1200);
}
(async () => {
  const s = await j('/api/setup/status');
  if (s.ready) return location.href = '/';
  if (s.phase === 'running') { $('#pick').style.display = 'none'; $('#prog').style.display = ''; return poll(); }
  $('#found').innerHTML = (s.games || []).map(g => `<button type="button">${g.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</button>`).join('');
  $('#found').querySelectorAll('button').forEach(b => b.onclick = () => { $('#game').value = b.textContent; check(); });
  if (s.games && s.games.length === 1) { $('#game').value = s.games[0]; check(); }
})();
</script>
</body>
</html>
