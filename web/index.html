<style>
/* ---- design tokens: primitive -> semantic -> component (ui-ux-pro-max / design-system) ---- */
:root{
  /* primitive */
  --ink-950:#030409;--ink-900:#1a162f;--ink-800:#251d3b;--ink-700:#302447;--ink-600:#3e2d57;--ink-500:#7b6a9c;
  --sand-100:#ffffff;--sand-400:#b9aed3;--gold-400:#fc4c70;--gold-300:#ff7a94;--gold-900:#030409;
  --red-400:#f87171;--green-400:#4ade80;--blue-300:#7db1f5;
  --ui:1;
  --sp-1:calc(4px*var(--ui));--sp-2:calc(8px*var(--ui));--sp-3:calc(12px*var(--ui));--sp-4:calc(16px*var(--ui));--sp-5:calc(24px*var(--ui));
  --fs-xs:calc(13px*var(--ui));--fs-sm:calc(14px*var(--ui));--fs-md:calc(16px*var(--ui));--fs-lg:calc(18px*var(--ui));--fs-xl:calc(24px*var(--ui));
  --r-sm:6px;--r-md:8px;--r-lg:12px;
  --dur-fast:120ms;--dur-base:180ms;--ease:cubic-bezier(.2,.7,.2,1);
  --z-sticky:10;--z-overlay:40;--z-modal:100;
  /* semantic */
  --bg:var(--ink-950);--panel:var(--ink-900);--surface:var(--ink-800);--surface-hi:var(--ink-700);
  --line:var(--ink-600);--line-strong:#8a79ad;
  --text:var(--sand-100);--dim:#c9c0df;--acc:var(--gold-400);--acc-hi:var(--gold-300);--on-acc:var(--gold-900);
  --danger:var(--red-400);--ok:var(--green-400);--info:var(--blue-300);--ring:var(--gold-300);
  /* component */
  --row-h:calc(44px*var(--ui));--ctl-h:calc(38px*var(--ui));--header-h:calc(56px*var(--ui));
  --overlay:rgb(26 22 47 / .86);
  --glow:0 0 18px rgb(252 76 112 / .3);
}
/* channel fonts: Cinzel for Cyrillic, Optimus Princeps (headings) / Fontin (text) for Latin */
@font-face{font-family:'CV Head';src:url(/static/fonts/OptimusPrincepsSemiBold.ttf);font-weight:600;unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF,U+2200-22FF}
@font-face{font-family:'CV Head';src:url(/static/fonts/Cinzel-Medium.ttf);font-weight:600;unicode-range:U+0400-04FF}
@font-face{font-family:'CV Text';src:url(/static/fonts/fontin-regular-webfont.ttf);font-weight:400;unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF,U+2200-22FF}
@font-face{font-family:'CV Text';src:url(/static/fonts/fontin-bold-webfont.ttf);font-weight:700;unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF,U+2200-22FF}
@font-face{font-family:'CV Text';src:url(/static/fonts/fontin-italic-webfont.ttf);font-style:italic;unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF,U+2200-22FF}
@font-face{font-family:'CV Text';src:url(/static/fonts/Cinzel-Regular.ttf);font-weight:400;unicode-range:U+0400-04FF}
@font-face{font-family:'CV Text';src:url(/static/fonts/Cinzel-Medium.ttf);font-weight:500 700;unicode-range:U+0400-04FF}
:root{--font-head:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--font-text:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--font-brand:'CV Head',Cinzel,Georgia,serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-md)/1.5 var(--font-text);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:var(--on-acc);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);z-index:var(--z-modal)}
.skip:focus{left:8px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;gap:var(--sp-4);align-items:center;height:var(--header-h);padding:0 var(--sp-4);background:var(--panel);border-bottom:1px solid var(--line)}
.brand:hover{color:var(--acc-hi)}.brand:focus-visible{outline:2px solid var(--ring);outline-offset:4px;border-radius:var(--r-sm)}
.brand{background:none;border:0;padding:0;font-family:var(--font-brand);cursor:pointer;display:flex;align-items:center;gap:var(--sp-2);font-weight:600;font-size:var(--fs-lg);color:var(--sand-100);letter-spacing:.08em;white-space:nowrap}
.brand .ico{color:var(--acc);filter:drop-shadow(var(--glow))}
.vol{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);color:var(--dim);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}.vol input{width:96px}.vol #volv{min-width:32px;text-align:right}.vol:hover{color:var(--text)}
.brand .ico{width:20px;height:20px}
header small{color:var(--dim);margin-left:var(--sp-3);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{display:flex;gap:2px;align-items:stretch;height:100%;overflow-x:auto}
nav button{display:flex;align-items:center;gap:6px;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:0 var(--sp-3);cursor:pointer;font:inherit;font-weight:500;white-space:nowrap;transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
nav button:hover{color:var(--text);background:var(--surface)}
nav button[aria-current=page]{color:var(--text);border-bottom-color:var(--acc);box-shadow:inset 0 -12px 14px -12px rgb(252 76 112 / .45)}
nav button[aria-current=page] .ico{color:var(--acc)}
nav button:focus-visible{outline-offset:-3px}
header{min-width:0;overflow:hidden}header small{flex:0 1 auto;min-width:0}nav{flex:0 1 auto;min-width:0}.vol{flex:none}
html,body{max-width:100vw;overflow-x:hidden}
@media (max-width:1500px){header small{display:none}}
@media (max-width:1250px){.vol input{width:64px}}
nav button{padding:0 var(--sp-2)}
main{flex:1;display:flex;min-height:0;min-width:0;overflow:hidden}
#left{width:340px;min-width:200px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
#bar{padding:var(--sp-2) var(--sp-3);display:flex;gap:var(--sp-2);align-items:center;border-bottom:1px solid var(--line)}
input,select,button{font:inherit}
.brand,.ed h4,.sec-head,.skill-head .name,nav button{font-family:var(--font-head)}
input[type=text],input:not([type]),input[type=search],select,.ed input,.ed select,#picker .box input{background:var(--surface);border:1px solid var(--line-strong);color:var(--text);height:var(--ctl-h);padding:0 var(--sp-3);border-radius:var(--r-sm);transition:border-color var(--dur-fast) var(--ease)}
input::placeholder{color:var(--dim);opacity:.85}
input:hover,select:hover{border-color:var(--dim)}
input:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:0;border-color:var(--ring)}
#bar input[type=text]{flex:1 1 100%;min-width:0}
#bar label{color:var(--dim);display:flex;align-items:center;gap:var(--sp-1);white-space:nowrap;font-size:var(--fs-sm)}
input[type=checkbox],input[type=range]{accent-color:var(--acc);height:auto}
input[type=range]{padding:0;background:none;border:0}
#list{flex:1;overflow:auto;scrollbar-gutter:stable}
.row{min-height:var(--row-h);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-md);border-bottom:1px solid var(--ink-800);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);transition:background var(--dur-fast) var(--ease)}
.row:hover{background:var(--surface)}
.row.on{background:var(--surface-hi);box-shadow:inset 3px 0 0 var(--acc)}
.row>div{min-width:0;overflow-wrap:anywhere}
.row span{color:var(--dim);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%;flex:none}
.row.muted{opacity:.55}
.sec-head{position:sticky;top:0;z-index:var(--z-sticky);background:var(--panel);color:var(--acc);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);font-weight:600;border-bottom:1px solid var(--line)}
.sec-head.ok{color:var(--text)}
#skmid{width:clamp(280px,23.3vw,520px);min-width:260px;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:var(--sp-3);flex:none}
#skmid[hidden]{display:none}
#mgrip{flex:none;width:6px;margin:0 -3px;z-index:5;cursor:col-resize;position:relative;touch-action:none}#mgrip[hidden]{display:none}#mgrip::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:transparent;transition:background var(--dur-fast)}#mgrip:hover::after,#mgrip.on::after,#mgrip:focus-visible::after{background:var(--acc)}
body.skills-tab #skmid{padding:var(--sp-2) var(--sp-3)}
body.skills-tab #view{flex:1 1 0;min-height:160px}
body.skills-tab #info:not(.custom){max-height:none;flex:0 0 55%;min-height:0}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;position:relative;min-height:200px;background:radial-gradient(var(--ink-600),var(--ink-950))}
#view canvas{display:block;width:100%;height:100%}
#info{padding:var(--sp-2) var(--sp-3);border-top:1px solid var(--line);background:var(--panel);font-size:var(--fs-sm);color:var(--dim);max-height:30%;overflow:auto;overflow-wrap:anywhere}
#info a{color:var(--acc)}
#tablewrap{flex:1;overflow:auto}
table{border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:3px 8px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;text-align:left}
th{position:sticky;top:0;background:var(--surface);color:var(--text);font-family:var(--font-head)}
tr:hover td{background:var(--surface)}
pre{margin:0;padding:var(--sp-3);white-space:pre-wrap;font:var(--fs-xs)/1.5 Consolas,monospace}
.msg{padding:var(--sp-4);color:var(--dim)}
/* viewer overlay controls */
#view .ctl{position:absolute;z-index:var(--z-overlay);background:var(--overlay);backdrop-filter:blur(6px);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--r-sm);height:var(--ctl-h);padding:0 var(--sp-3);right:var(--sp-3);width:208px}
#view .ctl.fs{right:auto;left:var(--sp-3);width:var(--ctl-h);padding:0;display:grid;place-items:center;cursor:pointer;top:var(--sp-3)}
#view .ctl.fs:hover{border-color:var(--acc);color:var(--acc)}
/* in-game item tooltip (kept faithful to the game's look) */
.tip{width:360px;max-width:100%;margin:10px auto;border:1px solid #5b4a32;background:#0c0a08;font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;text-align:center;color:#c8c8c8;box-shadow:0 0 14px #000}
.ih{position:relative;display:flex;width:100%}.ih .l,.ih .r{flex:none;height:100%}.ih .m{flex:1;height:100%}.ih .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 38px;line-height:1.15;pointer-events:none;overflow:hidden}.ih .n{font:19px/1.1 'Palatino Linotype','Book Antiqua',Georgia,serif;font-variant:small-caps;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.ih .s{font:15px/1.1 'Palatino Linotype','Book Antiqua',Georgia,serif;font-variant:small-caps;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.ih.k-unique .n,.ih.k-unique .s{color:#e8923f}.ih.k-white .n{color:#c8c8c8}.ih.k-gem .n{color:#1ba29b}.ih.k-currency .n{color:#aa9e82}.ih.k-quest .n{color:#4ae63a}.ih.k-magic .n{color:#8888ff}.ih.k-rare .n{color:#ffff77}
.tipf{position:fixed;z-index:var(--z-modal);width:360px;pointer-events:none;filter:drop-shadow(0 8px 24px #000a)}.tipf .tip{margin:0;width:100%}
.infohdr{max-width:360px;margin:0 0 var(--sp-2)}
.tip .hd{padding:6px 10px;background:linear-gradient(#3a2a18,#1a120a);border-bottom:1px solid #5b4a32;color:#af6025;font-size:18px;line-height:1.25;font-variant:small-caps}
.tip .hd2{display:block;font-size:16px}
.tip .bd{padding:8px 12px;font-size:14px;line-height:1.55}
.tip .sep{height:1px;margin:6px 14px;background:linear-gradient(90deg,transparent,#8a5a2b,transparent)}
.tip .k{color:#8c8c8c}.tip .v{color:#8888ff}.tip .m{color:#8888ff}.tip .w{color:#fff}.tip .fl{color:#af6025;font-style:italic;padding:2px 6px}.tip .lg{color:#777;font-size:12px}
.tip .rg{color:#6a6ac8}
/* key figures: tiles used by every card */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:12px 0}.tile{background:rgb(255 255 255 / .06);border-radius:10px;padding:10px 12px}.tile small{display:block;font-size:var(--fs-sm);color:var(--dim);margin-bottom:2px}.tile b{font-size:24px;font-weight:600;line-height:1.1}.tile.key{background:rgb(122 90 248 / .25)}.tile.key b{color:#c9bfff}
/* monster card */
.mon .subtabs{display:flex;gap:2px;margin:var(--sp-2) 0;border-bottom:1px solid var(--line)}
.mon .subtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:var(--sp-1) var(--sp-3);cursor:pointer;font-family:var(--font-head);font-size:var(--fs-sm)}
.mon .subtabs button:hover{color:var(--text)}.mon .subtabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--acc)}
.mon .name{font-size:var(--fs-xl);font-weight:600;font-family:var(--font-head);color:var(--text)}.mon .sub{color:var(--dim);overflow-wrap:anywhere}
.mon h5{margin:var(--sp-4) 0 var(--sp-2);color:var(--acc);font:600 var(--fs-md)/1.2 var(--font-head)}
.kvt{border-collapse:collapse;width:100%}.kvt th{width:42%;text-align:left;color:var(--dim);font-weight:400;border:0;border-bottom:1px solid var(--line);background:none;position:static;padding:3px 6px}.kvt td{border:0;border-bottom:1px solid var(--line);white-space:normal;overflow-wrap:anywhere;color:var(--text);padding:3px 6px;max-width:none}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-1)}.chips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--text);font-size:var(--fs-xs)}
.sk{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}.sk img{object-fit:contain;flex:none}
.evl{max-height:260px;overflow:auto;font-size:var(--fs-xs);line-height:1.6;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2);background:var(--panel)}
.aud audio{width:100%;height:32px}
.mon details{margin:var(--sp-1) 0}.mon summary{cursor:pointer;color:var(--acc);font-family:var(--font-head)}.mon .fl{font-size:var(--fs-xs);color:var(--dim);padding:1px 4px;cursor:pointer;word-break:break-all}.mon .fl:hover{color:var(--text);background:var(--surface)}
pre.src{font-size:11px;max-height:240px;overflow:auto;background:var(--panel);border:1px solid var(--line);margin:2px 0}
/* editor / skills panels */
.ed{padding:var(--sp-2) var(--sp-3) var(--sp-4);font-size:var(--fs-sm)}
.ed h4{margin:var(--sp-4) 0 var(--sp-2);color:var(--acc);font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:var(--sp-2)}
.ed h4::after{content:"";flex:1;height:1px;background:var(--line)}
.edlist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);margin-top:var(--sp-2);background:var(--panel)}
.edlist .row{padding:2px var(--sp-2)}
.slot{display:flex;gap:var(--sp-2);align-items:center;margin:var(--sp-1) 0}
.slot b{width:92px;font-weight:500;color:var(--dim);flex:none}
.slot button{flex:1;min-width:0;height:var(--ctl-h);text-align:left;background:var(--surface);border:1px solid var(--line-strong);color:var(--text);border-radius:var(--r-sm);padding:0 var(--sp-2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color var(--dur-fast) var(--ease)}
.slot button:hover{border-color:var(--acc)}
.slot .x{flex:none;width:var(--ctl-h);text-align:center;padding:0;color:var(--dim)}
.slot .x:hover{color:var(--danger);border-color:var(--danger)}
.skill-head{display:flex;gap:var(--sp-3);align-items:center}
.skill-head .name{font-size:var(--fs-xl);font-weight:600;line-height:1.2}
.skill-head .sub{color:var(--dim)}
.tags{color:var(--dim);margin:var(--sp-2) 0}
.lead{line-height:1.55}
.kv{color:var(--dim);margin:var(--sp-1) 0;font-variant-numeric:tabular-nums}
.stats{line-height:1.55}.stats hr{border:0;border-top:1px solid var(--line);margin:var(--sp-2) 0}
.fx{margin-bottom:var(--sp-2);line-height:1.4}.fx .f{color:var(--dim);word-break:break-all;font-size:var(--fs-xs)}.fx .p{font-size:var(--fs-xs);word-break:break-all}
.tl{font-size:var(--fs-xs);color:var(--dim);word-break:break-all}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:calc(var(--sp-2) * -1) calc(var(--sp-3) * -1) var(--sp-2);padding:0 var(--sp-2);position:sticky;top:calc(var(--sp-2) * -1);background:var(--panel);z-index:var(--z-sticky);overflow-x:auto}
.mtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:var(--sp-2) var(--sp-3);cursor:pointer;font-family:var(--font-head);font-size:var(--fs-sm);white-space:nowrap}
.mtabs button:hover{color:var(--text)}.mtabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.mtabs i{font-style:normal;color:var(--dim);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}

// Volumetric fog + moon shafts: ray-marched in screen space from the depth buffer.
class AtmoPass extends ShaderPass{
  constructor(cam){
    super({uniforms:{tDiffuse:{value:null},tDepth:{value:null},uProjInv:{value:new THREE.Matrix4()},uViewInv:{value:new THREE.Matrix4()},uProj:{value:new THREE.Matrix4()},uView:{value:new THREE.Matrix4()},

      vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader:`
      precision highp float;
      uniform sampler2D tDiffuse,tDepth; uniform mat4 uProjInv,uViewInv,uProj,uView; uniform vec3 uCam,uMoon,uFogCol,uMoonCol; uniform float uDens,uTime,uRays; varying vec2 vUv;
      float h13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
      float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
        return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x),f.y),f.z);}
      vec3 wpos(vec2 uv,float d){vec4 n=vec4(uv*2.-1.,d*2.-1.,1.);vec4 v=uProjInv*n;v/=v.w;return (uViewInv*v).xyz;}
      void main(){
        vec4 col=texture2D(tDiffuse,vUv);
        float d=texture2D(tDepth,vUv).x;
        vec3 P=wpos(vUv,d); vec3 rd=P-uCam; float L=min(length(rd),26.); rd=normalize(rd);
        const int N=16; float stepL=L/float(N); float jit=h13(vec3(gl_FragCoord.xy,uTime*60.));

          float ph=.55+.45*pow(max(dot(rd,uMoon),0.),3.);

          tr*=exp(-ext);
        }

      }`});

    super.render(r,wb,rb,dt,m);
  }
